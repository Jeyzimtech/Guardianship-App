name: CD — Deploy to Production

on:
  push:
    branches: [production]

# Only one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: 🚀 Deploy Laravel Backend to Server
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://109.199.99.156

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, json, tokenizer, xml, ctype, openssl
          coverage: none

      - name: 📦 Install Composer dependencies (production)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: 📂 Deploy via rsync to server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: "backend/"
          TARGET: "/var/www/guardianship/backend"
          ARGS: "-avz --delete --exclude='.env' --exclude='storage/logs/' --exclude='storage/framework/cache/' --exclude='storage/framework/sessions/' --exclude='storage/framework/views/' --exclude='database/database.sqlite'"

      - name: ⚙️ Run post-deploy artisan commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd /var/www/guardianship/backend

            echo "--- Setting permissions ---"
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "--- Running artisan commands ---"
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan queue:restart

            echo "--- Deployment complete ✅ ---"
